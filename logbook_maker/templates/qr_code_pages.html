<!DOCTYPE html>

    <title>Image Grid</title>
    <style>
        /* Style the image grid */
        .image-grid {
            display: grid;
            grid-template-columns: repeat(6, 2.4cm);
            grid-gap: 0.7cm;

        /* Style the images */
        .image-grid img {
